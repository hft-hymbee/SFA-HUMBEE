<!-- @dsCard group="Colors" viewport="700x150" name="Accent & Secondary" subtitle="Amber accent (buttons, steppers) + deep-green secondary" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;font-family:var(--font-family-base);background:#fff;color:#333}
  .sw{display:flex;flex-wrap:wrap;gap:12px}
  .chip{display:flex;flex-direction:column;gap:6px}
  .box{width:132px;height:56px;border-radius:8px;border:1px solid rgba(0,0,0,.08)}
  .name{font-size:12px;font-weight:700;color:#333}
  .hex{font-size:11px;color:#8C8C8C;font-variant-numeric:tabular-nums}
</style></head><body><div class="sw">
<div class="chip"><div class="box" style="background:#FFA525"></div><span class="name">Accent</span><span class="hex">#FFA525</span></div>
<div class="chip"><div class="box" style="background:#FFC066"></div><span class="name">Accent Hover</span><span class="hex">#FFC066</span></div>
<div class="chip"><div class="box" style="background:#FF9600"></div><span class="name">Accent Active</span><span class="hex">#FF9600</span></div>
<div class="chip"><div class="box" style="background:#01522B"></div><span class="name">Secondary</span><span class="hex">#01522B</span></div>
</div></body></html>
