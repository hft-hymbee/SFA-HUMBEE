<!-- @dsCard group="Colors" viewport="700x150" name="Primary — Amber-Brown" subtitle="The Humbee signature colour and its states" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;font-family:var(--font-family-base);background:#fff;color:#333}
  .sw{display:flex;flex-wrap:wrap;gap:12px}
  .chip{display:flex;flex-direction:column;gap:6px}
  .box{width:132px;height:56px;border-radius:8px;border:1px solid rgba(0,0,0,.08)}
  .name{font-size:12px;font-weight:700;color:#333}
  .hex{font-size:11px;color:#8C8C8C;font-variant-numeric:tabular-nums}
</style></head><body><div class="sw">
<div class="chip"><div class="box" style="background:#995A00"></div><span class="name">Primary</span><span class="hex">#995A00</span></div>
<div class="chip"><div class="box" style="background:#BF7000"></div><span class="name">Hover</span><span class="hex">#BF7000</span></div>
<div class="chip"><div class="box" style="background:#663C00"></div><span class="name">Active</span><span class="hex">#663C00</span></div>
<div class="chip"><div class="box" style="background:#A56100"></div><span class="name">Dark</span><span class="hex">#A56100</span></div>
<div class="chip"><div class="box" style="background:#FFBF40"></div><span class="name">Light</span><span class="hex">#FFBF40</span></div>
</div></body></html>
