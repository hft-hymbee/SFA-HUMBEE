<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Success, error, warning and info" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;font-family:var(--font-family-base);background:#fff;color:#333}
  .sw{display:flex;flex-wrap:wrap;gap:12px}
  .chip{display:flex;flex-direction:column;gap:6px}
  .box{width:132px;height:56px;border-radius:8px;border:1px solid rgba(0,0,0,.08)}
  .name{font-size:12px;font-weight:700;color:#333}
  .hex{font-size:11px;color:#8C8C8C;font-variant-numeric:tabular-nums}
</style></head><body><div class="sw">
<div class="chip"><div class="box" style="background:#008000"></div><span class="name">Success</span><span class="hex">#008000</span></div>
<div class="chip"><div class="box" style="background:#CC0000"></div><span class="name">Error</span><span class="hex">#CC0000</span></div>
<div class="chip"><div class="box" style="background:#FFBF40"></div><span class="name">Warning</span><span class="hex">#FFBF40</span></div>
<div class="chip"><div class="box" style="background:#0081F2"></div><span class="name">Info</span><span class="hex">#0081F2</span></div>
</div></body></html>
