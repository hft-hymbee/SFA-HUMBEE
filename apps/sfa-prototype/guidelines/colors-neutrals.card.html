<!-- @dsCard group="Colors" viewport="700x180" name="Neutrals & Text" subtitle="Greyscale surfaces, borders and text tones" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;font-family:var(--font-family-base);background:#fff;color:#333}
  .sw{display:flex;flex-wrap:wrap;gap:12px}
  .chip{display:flex;flex-direction:column;gap:6px}
  .box{width:132px;height:56px;border-radius:8px;border:1px solid rgba(0,0,0,.08)}
  .name{font-size:12px;font-weight:700;color:#333}
  .hex{font-size:11px;color:#8C8C8C;font-variant-numeric:tabular-nums}
</style></head><body><div class="sw">
<div class="chip"><div class="box" style="background:#333333"></div><span class="name">Text Primary</span><span class="hex">#333333</span></div>
<div class="chip"><div class="box" style="background:#666666"></div><span class="name">Text Secondary</span><span class="hex">#666666</span></div>
<div class="chip"><div class="box" style="background:#8C8C8C"></div><span class="name">Placeholder</span><span class="hex">#8C8C8C</span></div>
<div class="chip"><div class="box" style="background:#D9D9D9"></div><span class="name">Border</span><span class="hex">#D9D9D9</span></div>
<div class="chip"><div class="box" style="background:#E5E5E5"></div><span class="name">Surface 300</span><span class="hex">#E5E5E5</span></div>
<div class="chip"><div class="box" style="background:#F5F5F5"></div><span class="name">Surface 200</span><span class="hex">#F5F5F5</span></div>
<div class="chip"><div class="box" style="background:#F7F7F7"></div><span class="name">Surface 100</span><span class="hex">#F7F7F7</span></div>
</div></body></html>
