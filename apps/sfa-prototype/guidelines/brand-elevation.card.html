<!-- @dsCard group="Brand" viewport="700x180" name="Elevation & borders" subtitle="Humbee favours hairline borders over heavy shadow" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;font-family:var(--font-family-base);background:#fff;color:#333}
  .row{display:flex;align-items:baseline;gap:16px;padding:6px 0;border-bottom:1px solid #F5F5F5}
  .row:last-child{border-bottom:none}
  .meta{font-size:11px;color:#8C8C8C;min-width:118px;font-variant-numeric:tabular-nums}
  .spec{color:#333}
</style></head><body><div style="display:flex;gap:20px;flex-wrap:wrap">
<div style="width:150px;height:80px;border-radius:8px;background:#fff;border:1px solid #E5E5E5;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center"><span class="meta" style="min-width:0">card</span></div>
<div style="width:150px;height:80px;border-radius:8px;background:#fff;border:1px solid #8C8C8C;box-shadow:0 2px 8px rgba(0,0,0,.10);display:flex;align-items:center;justify-content:center"><span class="meta" style="min-width:0">menu</span></div>
<div style="width:150px;height:80px;border-radius:16px;background:#fff;box-shadow:0px 11px 15px -7px rgba(0,0,0,.2),0px 24px 38px 3px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center"><span class="meta" style="min-width:0">modal</span></div>
</div></body></html>
