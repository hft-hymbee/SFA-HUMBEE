<!-- @dsCard group="Spacing" viewport="700x190" name="Spacing scale" subtitle="8px base unit — xs 4 → 2xl 48" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;font-family:var(--font-family-base);background:#fff;color:#333}
  .row{display:flex;align-items:baseline;gap:16px;padding:6px 0;border-bottom:1px solid #F5F5F5}
  .row:last-child{border-bottom:none}
  .meta{font-size:11px;color:#8C8C8C;min-width:118px;font-variant-numeric:tabular-nums}
  .spec{color:#333}
</style></head><body><div style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;gap:12px"><span class="meta">xs · 4px</span><span style="height:16px;width:4px;background:#995A00;border-radius:2px"></span></div>
<div style="display:flex;align-items:center;gap:12px"><span class="meta">sm · 8px</span><span style="height:16px;width:8px;background:#995A00;border-radius:2px"></span></div>
<div style="display:flex;align-items:center;gap:12px"><span class="meta">md · 16px</span><span style="height:16px;width:16px;background:#995A00;border-radius:2px"></span></div>
<div style="display:flex;align-items:center;gap:12px"><span class="meta">lg · 24px</span><span style="height:16px;width:24px;background:#995A00;border-radius:2px"></span></div>
<div style="display:flex;align-items:center;gap:12px"><span class="meta">xl · 32px</span><span style="height:16px;width:32px;background:#995A00;border-radius:2px"></span></div>
<div style="display:flex;align-items:center;gap:12px"><span class="meta">2xl · 48px</span><span style="height:16px;width:48px;background:#995A00;border-radius:2px"></span></div>
</div></body></html>
