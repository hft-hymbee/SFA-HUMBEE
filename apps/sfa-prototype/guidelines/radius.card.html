<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;font-family:var(--font-family-base);background:#fff;color:#333}
  .row{display:flex;align-items:baseline;gap:16px;padding:6px 0;border-bottom:1px solid #F5F5F5}
  .row:last-child{border-bottom:none}
  .meta{font-size:11px;color:#8C8C8C;min-width:118px;font-variant-numeric:tabular-nums}
  .spec{color:#333}
</style></head><body><div style="display:flex;gap:20px;align-items:flex-end">
<div class="chip" style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:96px;height:64px;background:#FFF3DC;border:1px solid #995A00;border-radius:4px"></div><span class="meta" style="min-width:0">sm · 4px</span></div>
<div class="chip" style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:96px;height:64px;background:#FFF3DC;border:1px solid #995A00;border-radius:8px"></div><span class="meta" style="min-width:0">md · 8px</span></div>
<div class="chip" style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:96px;height:64px;background:#FFF3DC;border:1px solid #995A00;border-radius:16px"></div><span class="meta" style="min-width:0">lg · 16px</span></div>
<div class="chip" style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:96px;height:64px;background:#FFF3DC;border:1px solid #995A00;border-radius:32px"></div><span class="meta" style="min-width:0">xl · 32px</span></div>
</div></body></html>
