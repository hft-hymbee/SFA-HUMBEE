<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="./styles.css" />
<style>
  html,body{margin:0;padding:0}
  .tile{width:1280px;height:854px;display:flex;font-family:var(--font-family-base,Lato,sans-serif)}
  .main{flex:0 0 75%;background:#995A00;display:flex;align-items:center;justify-content:center}
  .mark{font-size:200px;font-weight:900;color:#fff;letter-spacing:-6px}
  .strip{flex:1;display:flex;flex-direction:column}
  .strip span{flex:1}
</style>
</head>
<body>
<div class="tile">
  <div class="main"><span class="mark">Humbee</span></div>
  <div class="strip">
    <span style="background:#FFBF40"></span>
    <span style="background:#FFA525"></span>
    <span style="background:#008000"></span>
    <span style="background:#CC0000"></span>
  </div>
</div>
</body>
</html>
