<!-- @dsCard group="Components" viewport="700x400" name="Forms — Inputs & Controls" subtitle="Text field, select, checkbox, radio, switch, quantity, inline edit" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; font-family: var(--font-family-base); background: #fff; color: #333; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px 24px; align-items: start; }
  .lbl { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: #8C8C8C; margin: 0 0 10px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { TextField, Select, Checkbox, RadioGroup, ToggleSwitch, QuantityHandler, InlineEditField } = window.HumbeeDesignSystem_c38d59;
function Demo() {
  const [cat, setCat] = React.useState("electronics");
  const [plan, setPlan] = React.useState("premium");
  const [qty, setQty] = React.useState(3);
  const [on, setOn] = React.useState(true);
  const [po, setPo] = React.useState("A-DND-12");
  return (
    <div className="grid">
      <div className="stack">
        <p className="lbl">Text Field</p>
        <TextField label="Email Address" placeholder="Enter your email" helperText="We'll never share it" required />
        <TextField label="Error state" placeholder="Value" error helperText="This field is required" />
      </div>
      <div className="stack">
        <p className="lbl">Select</p>
        <Select label="Category" placeholder="Select category" fullWidth value={cat} onChange={setCat}
          options={[{value:"electronics",label:"Electronics"},{value:"clothing",label:"Clothing"},{value:"books",label:"Books"}]} />
        <p className="lbl" style={{marginTop:8}}>Inline Edit</p>
        <InlineEditField label="User PO No." value={po} onSave={setPo} />
      </div>
      <div className="stack">
        <p className="lbl">Checkbox / Radio / Switch</p>
        <Checkbox label="I agree to the terms" checked onChange={()=>{}} />
        <Checkbox label="Select all" indeterminate onChange={()=>{}} />
        <RadioGroup label="Plan" value={plan} onChange={setPlan} row
          options={[{value:"basic",label:"Basic"},{value:"premium",label:"Premium"}]} />
        <ToggleSwitch label="Email notifications" checked={on} onChange={(e)=>setOn(e.target.checked)} />
        <QuantityHandler value={qty} onIncrease={()=>setQty(q=>q+1)} onDecrease={()=>setQty(q=>Math.max(1,q-1))} min={1} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
